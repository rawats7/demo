<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>JaiClub Sureshot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --green:#00e87a;--green2:#00c265;--green3:rgba(0,232,122,0.12);
  --gold:#f5c842;--gold2:#e6b800;--gold3:rgba(245,200,66,0.12);
  --red:#ff4d6d;--red3:rgba(255,77,109,0.12);
  --bg:#050b12;--bg2:#0b1520;--bg3:#101e2c;
  --card:rgba(11,21,32,0.85);
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#eef2f7;--muted:#6b8096;--muted2:#9eb5c8;
  --font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;
  --r1:16px;--r2:22px;--r3:32px;
}
html,body{height:100%;background:var(--bg);font-family:var(--font);color:var(--text);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 50% -5%,rgba(0,232,122,0.09),transparent),
             radial-gradient(ellipse 50% 40% at 80% 80%,rgba(245,200,66,0.06),transparent)}

#app{position:relative;max-width:430px;margin:0 auto;min-height:100dvh}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 18px 40px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 18px rgba(0,232,122,0.25)}50%{box-shadow:0 0 36px rgba(0,232,122,0.5)}}
@keyframes numberPop{0%{opacity:0;transform:scale(0.6) translateY(8px)}70%{transform:scale(1.08) translateY(-2px)}100%{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes scanline{0%{top:-4px}100%{top:calc(100% + 4px)}}
@keyframes orbA{to{transform:rotate(360deg)}}
@keyframes orbB{to{transform:rotate(-360deg)}}
@keyframes progressBar{from{width:0}to{width:100%}}
@keyframes dotBlink{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(0.5);opacity:0.3}}
@keyframes ringIn{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

.fu{animation:fadeUp 0.45s cubic-bezier(.2,.9,.4,1.1) both}
.fu1{animation-delay:.05s}.fu2{animation-delay:.12s}.fu3{animation-delay:.2s}.fu4{animation-delay:.28s}

/* ── Splash ── */
#splash{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;padding:56px 24px 52px;
  background:radial-gradient(ellipse 80% 55% at 50% 0%,rgba(0,232,122,0.14),transparent 65%),
             radial-gradient(ellipse 60% 40% at 50% 100%,rgba(245,200,66,0.08),transparent 65%),var(--bg)
}
.splash-badge{
  font-family:var(--mono);font-size:10px;letter-spacing:.25em;font-weight:600;
  color:var(--green);border:1px solid rgba(0,232,122,0.3);background:rgba(0,232,122,0.07);
  padding:5px 16px;border-radius:99px
}
.splash-h1{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-.03em;text-align:center;margin-top:14px;
  background:linear-gradient(135deg,#fff 30%,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.splash-sub{font-size:13px;color:var(--muted);margin-top:6px;text-align:center}

/* Orbital avatar */
.orb-wrap{position:relative;width:200px;height:200px}
.orb-ring{position:absolute;border-radius:50%;inset:0;margin:auto}
.orb-r1{width:170px;height:170px;inset:unset;top:15px;left:15px;border:1.5px solid rgba(0,232,122,0.18);animation:orbA 9s linear infinite}
.orb-r2{width:200px;height:200px;inset:0;border:1px dashed rgba(245,200,66,0.12);animation:orbB 14s linear infinite}
.orb-r1 .dot{position:absolute;top:-4px;left:50%;margin-left:-4px;width:8px;height:8px;
  border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
.orb-r2 .dot{position:absolute;bottom:-3px;left:50%;margin-left:-3px;width:6px;height:6px;
  border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.av-core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2}
.av-img{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid var(--green);display:block}
.av-fallback{width:90px;height:90px;border-radius:50%;background:linear-gradient(145deg,#0d1c12,#050d07);
  border:2px solid rgba(0,232,122,0.4);display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:800;color:var(--green);animation:glowPulse 3s ease-in-out infinite}
.av-glow{position:absolute;inset:-14px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,232,122,0.18),transparent 70%);pointer-events:none}
.av-check{position:absolute;bottom:2px;right:2px;width:24px;height:24px;border-radius:50%;
  background:var(--green);color:#000;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--bg);z-index:3}

.splash-name{font-size:22px;font-weight:700;text-align:center}
.splash-handle{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px;text-align:center}
.live-pill{display:flex;align-items:center;gap:7px;background:rgba(0,232,122,0.06);
  border:1px solid rgba(0,232,122,0.18);border-radius:99px;padding:7px 16px;font-size:13px;font-weight:600;color:var(--green)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:dotBlink 1.6s ease-in-out infinite}

.prog-wrap{width:100%;max-width:240px}
.prog-track{height:3px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;margin-bottom:8px}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .1s linear}
.prog-pct{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}

/* ── Glass card ── */
.card{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--r3)}

/* ── Top bar ── */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:20px 0 0}
.logo-wrap{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.logo-icon{width:40px;height:40px;border-radius:14px;background:var(--green3);border:1px solid rgba(0,232,122,0.2);
  display:flex;align-items:center;justify-content:center}
.logo-t1{font-size:15px;font-weight:700;letter-spacing:-.02em}
.logo-t2{font-size:10px;font-weight:500;color:var(--muted);margin-top:1px}
.top-live{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.04);
  border:1px solid var(--border);border-radius:99px;padding:6px 12px;font-size:11px;font-weight:600;color:var(--muted2)}

/* ── Hero ── */
.hero{padding:26px 0 6px}
.hero-sub{font-size:13px;color:var(--muted)}
.hero-name{font-size:32px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.hero-name em{color:var(--green);font-style:normal}

/* ── Info card ── */
.info-card{
  margin-top:16px;border-radius:var(--r2);padding:18px;
  background:rgba(0,232,122,0.03);border:1px solid rgba(0,232,122,0.1);position:relative;overflow:hidden
}
.info-scan{position:absolute;left:0;right:0;height:40px;
  background:linear-gradient(180deg,transparent,rgba(0,232,122,0.06),transparent);
  animation:scanline 4s linear infinite;pointer-events:none}
.info-title{font-size:14px;font-weight:700;margin-bottom:6px}
.info-desc{font-size:12px;color:var(--muted2);line-height:1.7}
.warn-pill{margin-top:10px;padding:7px 12px;background:rgba(245,200,66,0.07);border:1px solid rgba(245,200,66,0.18);
  border-radius:10px;font-size:11px;color:var(--gold);font-weight:500}

/* ── Stats ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px 10px;text-align:center}
.stat-v{font-size:22px;font-weight:800;color:var(--green);letter-spacing:-.02em}
.stat-l{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600}

/* ── Option buttons ── */
.opts{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.opt{width:100%;border:none;cursor:pointer;background:none;padding:0;text-align:left}
.opt-in{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:var(--r2);
  border:1px solid var(--border);background:var(--card);transition:border-color .2s,transform .15s,background .2s}
.opt:active .opt-in{transform:scale(.97)}
.opt.green .opt-in{border-color:rgba(0,232,122,0.18);background:rgba(0,232,122,0.03)}
.opt.gold .opt-in{border-color:rgba(245,200,66,0.18);background:rgba(245,200,66,0.03)}
.opt-icon-wrap{width:50px;height:50px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px}
.opt.green .opt-icon-wrap{background:rgba(0,232,122,0.1)}
.opt.gold .opt-icon-wrap{background:rgba(245,200,66,0.1)}
.opt.gray .opt-icon-wrap{background:rgba(255,255,255,0.05)}
.opt-title{font-size:14px;font-weight:700;letter-spacing:-.01em}
.opt-sub{font-size:11px;color:var(--muted);margin-top:3px;font-weight:500}
.opt-arrow{flex-shrink:0;color:var(--muted)}
.opt.green .opt-arrow{color:var(--green)}.opt.gold .opt-arrow{color:var(--gold)}
.opt-new{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
.opt.green .opt-new{background:var(--green3);color:var(--green)}.opt.gold .opt-new{background:var(--gold3);color:var(--gold)}

.footer-tip{margin-top:24px;padding:12px 16px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r2);font-size:11px;color:var(--muted);text-align:center;line-height:1.6}

/* ── Screen header ── */
.scr-hd{display:flex;align-items:center;justify-content:space-between;padding:20px 0 0}
.back-btn{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.back-btn:active{background:rgba(255,255,255,0.08)}
.scr-chip{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;
  font-size:11px;font-weight:700;letter-spacing:.05em;border:1px solid var(--border);background:var(--card)}
.scr-chip.green{border-color:rgba(0,232,122,0.25);background:rgba(0,232,122,0.07);color:var(--green)}
.scr-chip.gold{border-color:rgba(245,200,66,0.25);background:rgba(245,200,66,0.07);color:var(--gold)}
.scr-chip.red{border-color:rgba(255,77,109,0.25);background:rgba(255,77,109,0.07);color:var(--red)}
.chip-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ── UID info card ── */
.uid-card{margin-top:20px;border-radius:var(--r3);background:var(--card);border:1px solid var(--border);padding:20px}
.uid-icon{width:46px;height:46px;border-radius:16px;background:var(--green3);border:1px solid rgba(0,232,122,0.2);
  display:flex;align-items:center;justify-content:center;color:var(--green);flex-shrink:0}
.uid-greet{font-size:15px;font-weight:700}
.uid-greet span{color:var(--green)}
.uid-steps{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.uid-step{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted2)}
.step-num{width:20px;height:20px;border-radius:8px;background:var(--green3);color:var(--green);
  font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.reg-btn{width:100%;margin-top:16px;height:52px;border:none;cursor:pointer;border-radius:18px;
  background:linear-gradient(135deg,var(--green2),#00a35a);color:#000;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font);
  box-shadow:0 8px 28px rgba(0,232,122,0.22);transition:transform .1s,box-shadow .2s}
.reg-btn:active{transform:scale(.97);box-shadow:0 4px 16px rgba(0,232,122,0.15)}
.warn-strip{margin-top:10px;padding:9px 14px;border-radius:14px;font-size:11px;font-weight:600;
  background:rgba(255,77,109,0.06);border:1px solid rgba(255,77,109,0.15);color:var(--red)}

/* ── Input display ── */
.inp-section{margin-top:22px}
.inp-label{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:10px}
.inp-display{height:72px;border-radius:22px;background:rgba(0,0,0,0.4);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;transition:border-color .2s,box-shadow .2s}
.inp-display.has-val{border-color:rgba(0,232,122,0.3);box-shadow:0 0 0 3px rgba(0,232,122,0.06)}
.inp-val{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.08em}
.inp-val.empty{color:rgba(255,255,255,0.15);font-size:18px;letter-spacing:.15em}
.inp-count{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ── Keypad ── */
.keypad{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:66px;border-radius:20px;border:1px solid rgba(255,255,255,0.07);cursor:pointer;
  background:rgba(255,255,255,0.03);color:var(--text);font-size:24px;font-weight:700;
  font-family:var(--font);transition:all .12s;display:flex;align-items:center;justify-content:center}
.key:active{background:rgba(0,232,122,0.15);border-color:rgba(0,232,122,0.25);transform:scale(.93)}
.key-del{background:rgba(255,77,109,0.07);color:#ff8fa8;border-color:rgba(255,77,109,0.12)}
.key-del:active{background:rgba(255,77,109,0.2)}
.key-ok{background:linear-gradient(135deg,var(--green2),#009f56);border-color:transparent;color:#000;font-weight:800}
.key-ok:active{background:linear-gradient(135deg,#00a85e,#007a40);transform:scale(.93)}
.kp-note{text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:12px}

/* ── Processing ── */
#processing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:40px 20px}
.pr-ring-wrap{position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center}
.pr-ring{position:absolute;border-radius:50%;border-style:solid}
.pr-r1{width:80px;height:80px;border-width:2.5px;border-color:rgba(0,232,122,0.12);border-top-color:var(--green);animation:spin 1s linear infinite}
.pr-r2{width:60px;height:60px;border-width:2px;border-color:rgba(245,200,66,0.1);border-bottom-color:var(--gold);animation:spinRev 1.4s linear infinite}
.pr-dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 20px var(--green)}
.pr-title{font-size:24px;font-weight:800;margin-top:28px;text-align:center;letter-spacing:-.02em}
.pr-sub{font-size:13px;color:var(--muted);margin-top:6px}
.pr-steps{width:100%;margin-top:36px;display:flex;flex-direction:column;gap:10px}
.pr-step{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--r2);
  background:var(--card);border:1px solid var(--border);transition:all .3s}
.pr-step.active{border-color:rgba(0,232,122,0.22);background:rgba(0,232,122,0.04)}
.pr-step.done{opacity:.45}
.step-ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;background:rgba(255,255,255,0.04);color:var(--muted);flex-shrink:0}
.pr-step.active .step-ic{background:rgba(0,232,122,0.14);color:var(--green)}
.step-tx{font-size:13px;color:var(--muted);font-weight:500}
.pr-step.active .step-tx{color:var(--text)}

/* ── Result ── */
.result-card{text-align:center;background:linear-gradient(145deg,#0d1520,#03080f);border:1px solid rgba(255,77,109,0.22);padding:32px 22px}
.result-icon{width:80px;height:80px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px}
.result-icon.fail{background:rgba(255,77,109,0.12)}
.result-status{font-family:var(--mono);font-size:11px;letter-spacing:.18em;font-weight:700;
  display:inline-block;padding:4px 16px;border-radius:99px;margin-top:14px}
.result-status.fail{color:var(--red);background:rgba(255,77,109,0.1)}
.result-title{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:8px}
.result-uid{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:6px}
.reason-list{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.reason-item{padding:16px;border-radius:var(--r2);background:var(--card);border:1px solid var(--border);
  display:flex;gap:14px;align-items:flex-start}
.reason-em{font-size:26px;flex-shrink:0}
.reason-txt{font-size:13px;color:var(--muted2);line-height:1.65}
.reason-txt strong{color:var(--text);font-weight:700}
.action-row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:14px;border-radius:28px;font-weight:700;font-size:13px;text-align:center;cursor:pointer;border:none;font-family:var(--font);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--green);color:#000}
.btn-s{background:var(--card);border:1px solid var(--border2);color:var(--text)}

/* ── Prediction ── */
.pred-card{margin-top:20px;border-radius:var(--r3);background:var(--card);border:1px solid rgba(0,232,122,0.12);padding:18px 20px}
.pred-badge-row{display:flex;align-items:center;gap:10px}
.pred-badge-icon{width:44px;height:44px;border-radius:16px;background:var(--green3);border:1px solid rgba(0,232,122,0.2);
  display:flex;align-items:center;justify-content:center;color:var(--green);flex-shrink:0}
.pred-greet{font-size:15px;font-weight:700}
.pred-greet span{color:var(--green)}
.pred-uid{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.pred-divider{height:1px;background:var(--border);margin:14px 0}
.pred-mode-t{font-size:14px;font-weight:700}
.pred-mode-s{font-size:12px;color:var(--muted);margin-top:2px}
.toggle-row{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:18px;
  background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:18px;padding:4px}
.tog-btn{height:44px;border:none;cursor:pointer;border-radius:14px;font-size:13px;font-weight:700;
  background:none;color:var(--muted);transition:all .2s;font-family:var(--font)}
.tog-btn.on.green{background:rgba(0,232,122,0.1);color:var(--green);border:1px solid rgba(0,232,122,0.2)}
.tog-btn.on.gold{background:rgba(245,200,66,0.1);color:var(--gold);border:1px solid rgba(245,200,66,0.2)}
.pred-result-box{border-radius:var(--r3);padding:36px 20px;text-align:center;
  background:rgba(0,232,122,0.02);border:1px solid rgba(0,232,122,0.18);animation:ringIn 0.5s ease-out}
.pred-result-label{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--green);background:var(--green3);display:inline-block;padding:4px 14px;border-radius:99px;margin-bottom:18px}
.pred-num{font-size:104px;font-weight:800;line-height:1;letter-spacing:-.04em;
  background:linear-gradient(135deg,#fff 20%,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:numberPop 0.5s cubic-bezier(.2,.9,.4,1.1)}
.pred-bs{font-size:60px;font-weight:800;line-height:1;animation:numberPop 0.5s cubic-bezier(.2,.9,.4,1.1)}
.pred-bs.big{background:linear-gradient(135deg,#fff 10%,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.pred-bs.small{background:linear-gradient(135deg,#fff 10%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.pred-confirm{margin-top:16px;font-size:12px;color:var(--muted2);display:flex;align-items:center;justify-content:center;gap:7px;font-weight:500}
.pred-loading-box{border-radius:var(--r3);padding:40px 20px;text-align:center;background:rgba(0,0,0,0.35);border:1px solid var(--border)}
.pred-spin{width:40px;height:40px;margin:16px auto 0;border-radius:50%;border:2px solid rgba(0,232,122,0.15);border-top-color:var(--green);animation:spin .8s linear infinite}

/* ── Admin ── */
.admin-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(16px);
  z-index:1000;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .2s ease}
.admin-panel{width:100%;max-width:430px;max-height:88vh;background:#0a1420;border:1px solid rgba(0,232,122,0.25);
  border-radius:36px 36px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:slideDown .3s ease}
.admin-hd{padding:20px 20px 16px;background:rgba(0,232,122,0.07);border-bottom:1px solid rgba(0,232,122,0.15);
  display:flex;justify-content:space-between;align-items:center}
.admin-hd h3{font-size:18px;font-weight:800;color:var(--green);letter-spacing:-.02em}
.admin-close{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.06);
  border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.admin-search{padding:12px 16px;background:#080f18;border-bottom:1px solid var(--border)}
.admin-search input{width:100%;background:#14202e;border:1px solid var(--border2);border-radius:28px;
  padding:11px 18px;color:white;font-size:14px;font-family:var(--font);outline:none}
.admin-list{flex:1;overflow-y:auto;padding:12px 16px 16px}
.admin-item{background:rgba(255,255,255,0.025);border-radius:20px;padding:14px 16px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,0.05)}
.admin-uid{font-family:var(--mono);font-size:14px;font-weight:600}
.admin-uid small{display:block;font-size:10px;color:var(--muted);margin-top:2px;font-weight:400}
.admin-badge{background:rgba(0,232,122,0.15);padding:3px 10px;border-radius:99px;font-size:10px;color:var(--green);font-weight:700;font-family:var(--mono)}
.admin-acts button{background:none;border:none;cursor:pointer;margin-left:10px;font-size:13px;font-weight:700;font-family:var(--font)}
.admin-add{display:flex;gap:10px;padding:14px 16px;background:#080f18;border-top:1px solid var(--border)}
.admin-add input{flex:1;background:#14202e;border:1px solid var(--border2);border-radius:28px;
  padding:11px 16px;color:white;font-family:var(--mono);font-size:13px;outline:none}
.admin-add button{background:var(--green);border:none;border-radius:28px;padding:0 22px;
  font-weight:800;color:#000;cursor:pointer;font-family:var(--font);font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const tg=window.Telegram?.WebApp;
const iu=tg?.initDataUnsafe?.user||{first_name:"Demo",last_name:"User",username:"demo_user",photo_url:null};
const U={id:iu.id?.toString()||"demo",first_name:iu.first_name||"Demo",last_name:iu.last_name||"",username:iu.username||"demo_user",photo_url:iu.photo_url||null};
if(tg){tg.ready();tg.expand();tg.setHeaderColor("#050b12");tg.setBackgroundColor("#050b12")}

let mUIDs=JSON.parse(localStorage.getItem("mock_uids")||'[{"uid":"123456789012","active":true,"deviceId":null},{"uid":"987654321098","active":false,"deviceId":null}]');
function saveU(){localStorage.setItem("mock_uids",JSON.stringify(mUIDs))}
let aToken=localStorage.getItem("admin_token");
const MASTER="928616";
let dId=localStorage.getItem("device_id")||("dv_"+Math.random().toString(36).slice(2)+Date.now());
localStorage.setItem("device_id",dId);

async function mockVerify(uid){
  await new Promise(r=>setTimeout(r,1900));
  if(uid===MASTER)return{ok:true};
  const e=mUIDs.find(e=>e.uid===uid);
  if(!e||!e.active)return{ok:false,reason:"not_verified"};
  if(e.deviceId&&e.deviceId!==dId)return{ok:false,reason:"device_mismatch"};
  if(!e.deviceId){e.deviceId=dId;saveU()}
  return{ok:true}
}
async function mockPredict(period,type){
  await new Promise(r=>setTimeout(r,950));
  const s=(parseInt(period)||1)*3+7;
  if(type==="number")return{value:String(s%10)};
  return{value:s%2===0?"BIG":"SMALL"}
}
async function adminLogin(pw){
  if(pw==="admin123"){localStorage.setItem("admin_token","mock");aToken="mock";return true}
  return false
}
async function addAdminUID(uid){if(!mUIDs.some(e=>e.uid===uid)){mUIDs.push({uid,active:true,deviceId:null});saveU()}}
async function toggleAdminUID(uid){const e=mUIDs.find(e=>e.uid===uid);if(e)e.active=!e.active;saveU()}
async function deleteAdminUID(uid){mUIDs=mUIDs.filter(e=>e.uid!==uid);saveU()}

let S={screen:"splash",option:null,uid:"",vUid:null,fail:"",period:"",pred:null,loading:false,step:0,admin:false,aSearch:""};

function hap(s){if(tg?.HapticFeedback)tg.HapticFeedback.impactOccurred(s)}
function go(sc){S.screen=sc;render()}
function shake(id){const el=document.getElementById(id);if(!el)return;el.style.animation="shake 0.4s ease-in-out";setTimeout(()=>el.style.animation="",420)}

function chooseOpt(o){S.option=o;S.pred=null;S.period="";go(S.vUid?"prediction":"uid")}
function typeUid(d){if(S.uid.length<20){S.uid+=d;render()}}
function delUid(){S.uid=S.uid.slice(0,-1);render()}
async function submitUid(){
  if(!S.uid){shake("uid-disp");hap("error");return}
  S.step=0;go("processing");
  setTimeout(()=>{S.step=1;render()},750);
  setTimeout(()=>{S.step=2;render()},1450);
  const res=await mockVerify(S.uid);
  if(res.ok){S.vUid=S.uid;go("prediction")}
  else{S.fail=res.reason;go("result")}
}
function typePeriod(d){if(S.period.length<3){S.period+=d;render()}}
function delPeriod(){S.period=S.period.slice(0,-1);render()}
async function submitPeriod(){
  if(S.period.length<3){shake("period-disp");hap("error");return}
  S.loading=true;render();
  const p=await mockPredict(S.period,S.option);
  if(p)S.pred=p;
  S.loading=false;render()
}
function switchOpt(o){S.option=o;S.pred=null;S.period="";render()}
function resetHome(){S={...S,screen:"home",option:null,uid:"",period:"",pred:null,fail:"",loading:false,step:0,admin:false,aSearch:""};render()}
function retryUid(){S.fail="";go("uid")}
async function openAdmin(){
  if(!aToken){const pw=prompt("🔐 Admin password:");if(!pw)return;const ok=await adminLogin(pw);if(!ok){alert("Wrong password");return}}
  S.admin=true;render()
}
function closeAdmin(){S.admin=false;render()}
async function addUID(){
  const inp=document.getElementById("new-uid-inp");
  const uid=inp?.value?.trim();
  if(!uid||!/^\d+$/.test(uid)){alert("Digits only");return}
  await addAdminUID(uid);inp.value="";render()
}
async function toggleUID(uid){await toggleAdminUID(uid);render()}
async function deleteUID(uid){if(confirm("Delete UID?")){ await deleteAdminUID(uid);render()}}

function svgCheck(){return`<svg width="14"height="14"viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="3"stroke-linecap="round"stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`}
function svgBack(){return`<svg width="18"height="18"viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="2"stroke-linecap="round"stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`}
function svgDel(){return`<svg width="20"height="20"viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="2"stroke-linecap="round"stroke-linejoin="round"><path d="M21 5H8L2 12l6 7h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><line x1="18"y1="9"x2="12"y2="15"/><line x1="12"y1="9"x2="18"y2="15"/></svg>`}
function svgArrow(){return`<svg width="18"height="18"viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="2"stroke-linecap="round"stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`}
function svgExt(){return`<svg width="16"height="16"viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="2.2"stroke-linecap="round"stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10"y1="14"x2="21"y2="3"/></svg>`}
function svgShield(){return`<svg width="20"height="20"viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="1.8"stroke-linecap="round"stroke-linejoin="round"><path d="M12 2L4 6v6c0 5 3.5 9.5 8 10 4.5-.5 8-5 8-10V6l-8-4z"/><path d="M9 12l2 2 4-4"/></svg>`}
function svgCard(){return`<svg width="20"height="20"viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="1.8"><rect x="3"y="4"width="18"height="16"rx="3"/><path d="M3 10h18"/><path d="M8 14h4"/></svg>`}

function renderSplash(){
  const fl=U.first_name[0]?.toUpperCase()||"D";
  const av=U.photo_url?`<img src="${U.photo_url}"class="av-img"referrerpolicy="no-referrer">`:`<div class="av-fallback">${fl}</div>`;
  return`<div id="splash">
  <div class="fu"><span class="splash-badge">⚡ PREMIUM BOT</span>
    <div class="splash-h1">JaiClub<br>Sureshot</div>
    <div class="splash-sub">India's No.1 Colour Prediction</div>
  </div>
  <div class="orb-wrap fu fu1">
    <div class="orb-ring orb-r1"><div class="dot"></div></div>
    <div class="orb-ring orb-r2"><div class="dot"></div></div>
    <div class="av-core">
      <div class="av-glow"></div>
      ${av}
      <div class="av-check">${svgCheck()}</div>
    </div>
  </div>
  <div class="fu fu2"><div class="splash-name">${U.first_name} ${U.last_name}</div><div class="splash-handle">@${U.username}</div></div>
  <div class="live-pill fu fu3"><span class="live-dot"></span>Connecting to server</div>
  <div class="prog-wrap fu fu4">
    <div class="prog-track"><div class="prog-fill"id="pfill"></div></div>
    <div class="prog-pct">INITIALIZING <span id="ppct">0%</span></div>
  </div>
</div>`
}

function startSplash(){
  let p=0;
  const iv=setInterval(()=>{
    p+=Math.random()*16+5;
    if(p>=100){clearInterval(iv);setTimeout(()=>go("home"),350)}
    const f=document.getElementById("pfill"),pt=document.getElementById("ppct");
    if(f)f.style.width=Math.min(p,100)+"%";
    if(pt)pt.textContent=Math.min(Math.round(p),100)+"%"
  },160)
}

function renderHome(){
  return`<div class="screen"><div class="topbar fu">
  <div class="logo-wrap"id="logo-tap"><div class="logo-icon">${svgShield()}</div><div><div class="logo-t1">JaiClub</div><div class="logo-t2">Sureshot · Premium</div></div></div>
  <div class="top-live"><span class="live-dot"></span>Live</div></div>
  <div class="hero fu fu1"><div class="hero-sub">Welcome back</div><div class="hero-name">Hey ${U.first_name} <em>👋</em></div></div>
  <div class="info-card fu fu2">
    <div class="info-scan"></div>
    <div class="info-title">🏆 JaiClubGame Prediction Bot</div>
    <div class="info-desc">94% accuracy on verified UIDs · Powered by live pattern analysis</div>
    <div class="warn-pill">⚠️ Only official-link registered UIDs are accepted</div>
  </div>
  <div class="stats fu fu3">
    <div class="stat"><div class="stat-v">94%</div><div class="stat-l">Accuracy</div></div>
    <div class="stat"><div class="stat-v">12.4K</div><div class="stat-l">Members</div></div>
    <div class="stat"><div class="stat-v">38✓</div><div class="stat-l">Today</div></div>
  </div>
  <div class="opts fu fu4">
    <button class="opt green"onclick="chooseOpt('number')"><div class="opt-in"><div class="opt-icon-wrap">🎯</div><div style="flex:1"><div class="opt-title">Number Sureshot<span class="opt-new">HOT</span></div><div class="opt-sub">Single-digit exact prediction</div></div><div class="opt-arrow">${svgArrow()}</div></div></button>
    <button class="opt gold"onclick="chooseOpt('bigsmall')"><div class="opt-in"><div class="opt-icon-wrap">📊</div><div style="flex:1"><div class="opt-title">Big / Small Sureshot<span class="opt-new">NEW</span></div><div class="opt-sub">Best big-small forecast</div></div><div class="opt-arrow">${svgArrow()}</div></div></button>
    <button class="opt gray"onclick="window.open('https://t.me/Shetty_Bhaiii','_blank')"><div class="opt-in"><div class="opt-icon-wrap">💬</div><div style="flex:1"><div class="opt-title">Contact Support</div><div class="opt-sub">Talk to admin on Telegram</div></div><div class="opt-arrow">${svgArrow()}</div></div></button>
  </div>
  <div class="footer-tip fu" style="animation-delay:.36s">⚡ Pro tip — Register only via the official link to get predictions activated</div>
</div>`
}

function renderUid(){
  const nm=S.option==="number"?"Number Sureshot":"Big / Small Sureshot";
  return`<div class="screen"><div class="scr-hd fu"><button class="back-btn"onclick="resetHome()">${svgBack()}</button><div class="scr-chip gold"><span class="chip-dot"></span>${nm}</div><div style="width:40px"></div></div>
  <div class="uid-card fu fu1"><div style="display:flex;gap:14px;align-items:flex-start">
    <div class="uid-icon">${svgCard()}</div>
    <div><div class="uid-greet">Hey <span>${U.first_name}</span> 🧑‍💻</div>
    <div class="uid-steps">
      <div class="uid-step"><span class="step-num">1</span>Use the official registration link</div>
      <div class="uid-step"><span class="step-num">2</span>Complete registration below</div>
      <div class="uid-step"><span class="step-num">3</span>Enter your UID on keypad</div>
    </div></div></div>
    <button class="reg-btn"onclick="window.open('https://www.jaiclub40.com/#/register?invitationCode=27868186702','_blank')">${svgExt()} Register on Official Site</button>
    <div class="warn-strip">⚠️ Unofficial link registrations will fail verification</div>
  </div>
  <div class="inp-section fu fu2"><div class="inp-label">Your UID</div>
    <div class="inp-display${S.uid?' has-val':''}"id="uid-disp">
      <div class="inp-val${S.uid?'':' empty'}">${S.uid||'············'}</div>
      <div class="inp-count">${S.uid.length}</div>
    </div>
  </div>
  <div class="keypad fu fu3">${kpHtml("Uid")}</div>
  <div class="kp-note">🔒 Secure keypad · no paste</div></div>`
}

function kpHtml(ctx){
  const isUid=ctx==="Uid";
  return "123456789".split("").map(d=>`<button class="key"onclick="type${ctx}('${d}')">${d}</button>`).join("")+
  `<button class="key key-del"onclick="del${ctx}()">${svgDel()}</button>`+
  `<button class="key"onclick="type${ctx}('0')">0</button>`+
  `<button class="key key-ok"onclick="submit${ctx}()">${svgCheck()}</button>`
}

function renderProcessing(){
  const steps=["Connecting to server...","Checking UID & device...","Validating source..."];
  return`<div id="processing">
  <div class="pr-ring-wrap"><div class="pr-ring pr-r1"></div><div class="pr-ring pr-r2"></div><div class="pr-dot"></div></div>
  <div class="pr-title">Verifying UID</div><div class="pr-sub">Please wait a moment</div>
  <div class="pr-steps">${steps.map((t,i)=>`<div class="pr-step${i<S.step?' done':i===S.step?' active':''}">
    <div class="step-ic">${i<S.step?'✓':i+1}</div><div class="step-tx">${t}</div></div>`).join("")}</div>
</div>`
}

function renderResult(){
  const lock=S.fail==="device_mismatch";
  return`<div class="screen"><div class="scr-hd fu"><button class="back-btn"onclick="resetHome()">${svgBack()}</button><div class="scr-chip red"><span class="chip-dot"></span>${lock?"Device Locked":"Failed"}</div><div style="width:40px"></div></div>
  <div class="result-card card fu fu1" style="margin-top:20px">
    <div class="result-icon fail">${lock?"🔒":"⚠️"}</div>
    <div class="result-status fail">${lock?"DEVICE LOCKED":"VERIFICATION FAILED"}</div>
    <div class="result-title">${lock?"UID Locked to Another Device":"UID Not Verified"}</div>
    <div class="result-uid">UID: <span style="color:var(--text)">${S.uid}</span></div>
  </div>
  <div class="reason-list fu fu2">
    ${lock?`<div class="reason-item"><div class="reason-em">🔒</div><div class="reason-txt">This UID is already bound to another device.<br><strong>One UID = one device only.</strong></div></div>
    <div class="reason-item"><div class="reason-em">💬</div><div class="reason-txt">Contact admin to unbind: <strong>@Shetty_Bhaiii</strong></div></div>`
    :`<div class="reason-item"><div class="reason-em">🚨</div><div class="reason-txt"><strong>Bot activation required.</strong> Recharge ₹200 and try again.</div></div>
    <div class="reason-item"><div class="reason-em">⚠️</div><div class="reason-txt">Only UIDs from official registration are accepted.</div></div>`}
  </div>
  <div class="action-row fu fu3"><button class="btn btn-p"onclick="${lock?"window.open('https://t.me/Shetty_Bhaiii','_blank')":"window.open('https://www.jaiclub40.com/#/register?invitationCode=27868186702','_blank')"}">${lock?"Contact Admin":"Register Official Link"}</button></div>
  <div class="action-row fu" style="animation-delay:.32s"><button class="btn btn-s"onclick="retryUid()">Re-enter UID</button><button class="btn btn-s"onclick="resetHome()">Home</button></div>
</div>`
}

function renderPrediction(){
  const isNum=S.option==="number";
  let resultHtml="";
  if(S.loading){
    resultHtml=`<div class="pred-loading-box fu"><div style="font-size:14px;color:var(--muted)">Generating prediction...</div><div class="pred-spin"></div></div>`
  }else if(S.pred){
    const inner=isNum?`<div class="pred-num">${S.pred.value}</div>`:`<div class="pred-bs ${S.pred.value==='BIG'?'big':'small'}">${S.pred.value}</div>`;
    resultHtml=`<div class="pred-result-box fu"><div class="pred-result-label">Sureshot · Period ${S.period}</div>${inner}<div class="pred-confirm"><span style="color:var(--green)">●</span>Locked prediction — play with confidence</div></div>`
  }
  return`<div class="screen"><div class="scr-hd fu"><button class="back-btn"onclick="resetHome()">${svgBack()}</button><div class="scr-chip green"><span class="chip-dot"></span>Verified</div><div style="width:40px"></div></div>
  <div class="pred-card fu fu1">
    <div class="pred-badge-row"><div class="pred-badge-icon">${svgCheck()}</div>
    <div><div class="pred-greet">Welcome <span>${U.first_name}</span> ✓</div><div class="pred-uid">UID ${S.vUid} · verified</div></div></div>
    <div class="pred-divider"></div>
    <div class="pred-mode-t">${isNum?"Number Sureshot":"Big / Small Sureshot"}</div>
    <div class="pred-mode-s">Enter period number below</div>
  </div>
  <div class="toggle-row fu fu2">
    <button class="tog-btn${isNum?' on green':''}"onclick="switchOpt('number')">🎯 Number</button>
    <button class="tog-btn${!isNum?' on gold':''}"onclick="switchOpt('bigsmall')">📊 Big/Small</button>
  </div>
  <div class="inp-section fu fu3"><div class="inp-label">Period Number</div>
    <div class="inp-display${S.period?' has-val':''}"id="period-disp">
      <div class="inp-val${S.period?'':' empty'}">${S.period||'e.g. 247'}</div>
      <div class="inp-count">${S.period.length}/3</div>
    </div>
  </div>
  <div style="margin:16px 0">${resultHtml}</div>
  <div class="keypad fu fu4">${kpHtml("Period")}</div>
  <div class="kp-note">Tap again to re-roll a new prediction</div>
</div>`
}

async function renderAdmin(){
  if(!S.admin)return"";
  const filtered=mUIDs.filter(e=>e.uid.includes(S.aSearch));
  return`<div class="admin-overlay"onclick="if(event.target===this)closeAdmin()">
  <div class="admin-panel">
    <div class="admin-hd"><h3>⚙️ Admin Panel</h3><button class="admin-close"onclick="closeAdmin()">✕</button></div>
    <div class="admin-search"><input type="text"placeholder="🔍 Search UID"id="a-search"value="${S.aSearch}"oninput="S.aSearch=this.value;render()"></div>
    <div class="admin-list">${filtered.map(e=>`<div class="admin-item">
      <div><div class="admin-uid">${e.uid}<small>${e.deviceId?"🔗 bound":"📱 free"} · ${e.active?"✅ Active":"❌ Inactive"}</small></div></div>
      <div class="admin-acts"><button style="color:var(--gold)"onclick="toggleUID('${e.uid}')">${e.active?"Deactivate":"Activate"}</button><button style="color:var(--red)"onclick="deleteUID('${e.uid}')">Delete</button></div>
    </div>`).join("")}
    <div class="admin-item"style="background:rgba(0,232,122,0.07)"><div class="admin-uid">${MASTER}<small style="display:block">🔓 Always allowed</small></div><span class="admin-badge">MASTER</span></div>
    </div>
    <div class="admin-add"><input id="new-uid-inp"placeholder="Enter 12-digit UID"><button onclick="addUID()">Add</button></div>
  </div></div>`
}

async function render(){
  const app=document.getElementById("app");
  if(!app)return;
  if(S.screen==="splash"){app.innerHTML=renderSplash();startSplash();return}
  let html="";
  switch(S.screen){
    case"home":html=renderHome();break;
    case"uid":html=renderUid();break;
    case"processing":html=renderProcessing();break;
    case"result":html=renderResult();break;
    case"prediction":html=renderPrediction();break;
    default:html=renderHome()
  }
  const adm=await renderAdmin();
  app.innerHTML=html+adm;
  if(S.screen==="home"){
    const lg=document.getElementById("logo-tap");
    if(lg&&!lg._t){let c=0,t=null;const h=()=>{c++;if(t)clearTimeout(t);t=setTimeout(()=>c=0,800);if(c>=5){c=0;openAdmin()}};lg.addEventListener("click",h);lg._t=h}

}

Object.assign(window,{chooseOpt,typeUid,delUid,submitUid,typePeriod,delPeriod,submitPeriod,switchOpt,resetHome,retryUid,openAdmin,closeAdmin,addUID,toggleUID,deleteUID});
