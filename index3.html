<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>JaiClub Sureshot — Elite Predictions</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --g: #00ff88;
            --g2: #00cc6a;
            --gold: #fbbf24;
            --red: #ff3b3b;
            --bg: #030608;
            --surface: rgba(15, 25, 35, 0.65);
            --surface-light: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f0f4f8;
            --muted: #8e9eae;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a121c, #020406);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            min-height: 100dvh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 999;
        }

        #app {
            position: relative;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100dvh;
        }

        .screen {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 20px 32px;
            scrollbar-width: none;
        }

        .screen::-webkit-scrollbar {
            display: none;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes glow-pulse {
            0%,100% { box-shadow: 0 0 20px rgba(0,255,136,0.3); }
            50% { box-shadow: 0 0 40px rgba(0,255,136,0.6); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes orbit {
            to { transform: rotate(360deg); }
        }

        @keyframes orbit-rev {
            to { transform: rotate(-360deg); }
        }

        @keyframes number-pop {
            0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            60% { transform: scale(1.15) rotate(2deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        @keyframes ping {
            0% { box-shadow: 0 0 0 0 rgba(0,255,136,0.5); }
            70% { box-shadow: 0 0 0 10px rgba(0,255,136,0); }
            100% { box-shadow: 0 0 0 0 rgba(0,255,136,0); }
        }

        @keyframes scanline {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        .fade-up {
            animation: fadeUp 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1) both;
        }

        .glass-card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 28px;
        }

        .glow-primary {
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
        }

        .press:active {
            transform: scale(0.96);
            transition: transform 0.08s ease;
        }

        /* Splash screen (unchanged) */
        #splash {
            background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,255,136,0.18) 0%, transparent 60%),
                        radial-gradient(ellipse 60% 50% at 50% 110%, rgba(251,191,36,0.1) 0%, transparent 60%),
                        #030608;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 60px 32px;
            min-height: 100dvh;
        }

        .splash-brand .badge {
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 0.3em;
            color: var(--g);
            border: 1px solid rgba(0,255,136,0.4);
            background: rgba(0,255,136,0.06);
            padding: 5px 14px;
            border-radius: 99px;
        }

        .splash-brand h1 {
            font-family: 'Inter', sans-serif;
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 40%, var(--g) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 12px;
        }

        /* Home, UID, keypad same as previous but we'll integrate the new text input */
        .input-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .uid-text-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 14px 18px;
            color: white;
            font-family: 'Inter', monospace;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .uid-text-input:focus {
            outline: none;
            border-color: var(--g);
        }

        .paste-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0 18px;
            font-size: 14px;
            font-weight: 600;
            color: var(--g);
            cursor: pointer;
        }

        .keypad {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .key {
            height: 68px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 24px;
            font-weight: 700;
            transition: all 0.1s;
        }

        .key:active {
            background: rgba(0, 255, 136, 0.15);
            transform: scale(0.94);
        }

        .key-action {
            background: linear-gradient(135deg, var(--g2), #00a854);
            color: white;
            border: none;
        }

        .key-del {
            background: rgba(239, 68, 68, 0.1);
            color: #ff8a8a;
        }

        /* Admin panel improved */
        .admin-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .admin-panel {
            width: 100%;
            max-width: 460px;
            max-height: 85vh;
            background: #0f151c;
            border-radius: 40px;
            border: 1px solid rgba(0, 255, 136, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .admin-header {
            padding: 20px;
            background: rgba(0, 255, 136, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        }

        .admin-header h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--g);
        }

        .admin-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        .admin-search {
            padding: 16px;
            background: #0a0f14;
        }

        .admin-search input {
            width: 100%;
            background: #1a2128;
            border: 1px solid #2a333c;
            border-radius: 30px;
            padding: 12px 18px;
            color: white;
            font-size: 14px;
        }

        .admin-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 20px;
        }

        .admin-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s;
        }

        .admin-item-info {
            font-family: monospace;
            font-size: 15px;
            font-weight: 500;
        }

        .admin-item-info small {
            display: block;
            font-size: 10px;
            color: #8e9eae;
            margin-top: 3px;
        }

        .admin-badge {
            background: rgba(0, 255, 136, 0.15);
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 10px;
            color: var(--g);
        }

        .admin-item-actions button {
            background: none;
            border: none;
            cursor: pointer;
            margin-left: 8px;
            font-size: 18px;
        }

        .admin-add {
            display: flex;
            gap: 10px;
            padding: 16px;
            background: #0a0f14;
            border-top: 1px solid #1e2a32;
        }

        .admin-add input {
            flex: 1;
            background: #1a2128;
            border: 1px solid #2a333c;
            border-radius: 30px;
            padding: 12px 16px;
            color: white;
            font-family: monospace;
        }

        .admin-add button {
            background: var(--g);
            border: none;
            border-radius: 30px;
            padding: 0 24px;
            font-weight: 700;
            color: black;
            cursor: pointer;
        }

        /* Result page improvements */
        .result-card {
            text-align: center;
            background: linear-gradient(145deg, #0f1a1f, #03090d);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .result-icon {
            background: rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 30px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn-primary {
            background: var(--g);
            color: black;
        }

        .btn-secondary {
            background: var(--surface);
            border: 1px solid var(--border);
            color: white;
        }
    </style>
</head>
<body>
<div id="app"></div>
<script>
    // ==================== TELEGRAM USER DATA ====================
    const tg = window.Telegram?.WebApp;
    const initUser = tg?.initDataUnsafe?.user || { first_name: "Demo", last_name: "User", username: "demo_user", photo_url: null };
    const user = {
        id: initUser.id?.toString() || "demo",
        first_name: initUser.first_name || "Demo",
        last_name: initUser.last_name || "",
        username: initUser.username || "demo_user",
        photo_url: initUser.photo_url || null
    };
    if (tg) {
        tg.ready();
        tg.expand();
        tg.setHeaderColor("#030608");
        tg.setBackgroundColor("#030608");
    }

    // ==================== MOCK BACKEND (localStorage) ====================
    let mockUIDs = JSON.parse(localStorage.getItem("mock_uids") || '[{"uid":"123456789012","active":true,"deviceId":null},{"uid":"987654321098","active":false,"deviceId":null}]');
    function saveMockUIDs() { localStorage.setItem("mock_uids", JSON.stringify(mockUIDs)); }

    let adminToken = localStorage.getItem("admin_token");
    const MASTER_UID = "928616";
    let deviceId = localStorage.getItem("device_id") || ("dev_" + Math.random().toString(36).slice(2) + Date.now());
    localStorage.setItem("device_id", deviceId);

    async function mockVerify(uid) {
        await new Promise(r => setTimeout(r, 1800));
        if (uid === MASTER_UID) return { ok: true };
        const entry = mockUIDs.find(e => e.uid === uid);
        if (!entry) return { ok: false, reason: "not_verified" };
        if (!entry.active) return { ok: false, reason: "not_verified" };
        if (entry.deviceId && entry.deviceId !== deviceId) return { ok: false, reason: "device_mismatch" };
        if (!entry.deviceId) { entry.deviceId = deviceId; saveMockUIDs(); }
        return { ok: true };
    }

    async function mockPredict(period, type) {
        await new Promise(r => setTimeout(r, 900));
        const seed = (parseInt(period) || 1) * 3 + 7;
        if (type === "number") return { value: String(seed % 10) };
        return { value: seed % 2 === 0 ? "BIG" : "SMALL" };
    }

    async function adminLogin(password) {
        if (password === "admin123") {
            localStorage.setItem("admin_token", "mock_token");
            adminToken = "mock_token";
            return true;
        }
        return false;
    }

    // Admin helpers
    async function fetchAdminUIDs() { return [...mockUIDs]; }
    async function addAdminUID(uid) { if (!mockUIDs.some(e => e.uid === uid)) { mockUIDs.push({ uid, active: true, deviceId: null }); saveMockUIDs(); } }
    async function toggleAdminUID(uid) { const e = mockUIDs.find(e => e.uid === uid); if (e) e.active = !e.active; saveMockUIDs(); }
    async function deleteAdminUID(uid) { mockUIDs = mockUIDs.filter(e => e.uid !== uid); saveMockUIDs(); }

    // ==================== APP STATE ====================
    let appState = {
        screen: "splash",
        option: null,
        uid: "",
        verifiedUid: null,
        failReason: "",
        period: "",
        prediction: null,
        loading: false,
        procStep: 0,
        adminOpen: false,
        adminSearch: ""
    };

    function haptic(style) { if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(style); }

    function go(screen) { appState.screen = screen; render(); }
    function chooseOption(opt) { appState.option = opt; appState.prediction = null; appState.period = ""; go(appState.verifiedUid ? "prediction" : "uid"); }
    function setUid(value) { appState.uid = value.slice(0, 20); render(); }
    function typeUid(d) { appState.uid = (appState.uid + d).slice(0, 20); render(); }
    function delUid() { appState.uid = appState.uid.slice(0, -1); render(); }
    function pasteFromClipboard() {
        navigator.clipboard.readText().then(text => { setUid(text.replace(/\D/g, '')); }).catch(() => alert("Paste not allowed"));
    }
    async function submitUid() {
        if (!appState.uid) { shake("uid-display"); haptic("error"); return; }
        appState.procStep = 0; go("processing");
        setTimeout(() => { appState.procStep = 1; render(); }, 700);
        setTimeout(() => { appState.procStep = 2; render(); }, 1400);
        const res = await mockVerify(appState.uid);
        if (res.ok) { appState.verifiedUid = appState.uid; go("prediction"); }
        else { appState.failReason = res.reason; go("result"); }
    }
    function typePeriod(d) { if (appState.period.length < 3) { appState.period += d; render(); } }
    function delPeriod() { appState.period = appState.period.slice(0, -1); render(); }
    async function submitPeriod() {
        if (appState.period.length < 3) { shake("period-display"); haptic("error"); return; }
        appState.loading = true; render();
        const pred = await mockPredict(appState.period, appState.option);
        if (pred) appState.prediction = pred;
        appState.loading = false; render();
    }
    function switchOpt(opt) { appState.option = opt; appState.prediction = null; appState.period = ""; render(); }
    function resetHome() { appState = { ...appState, screen: "home", option: null, uid: "", period: "", prediction: null, failReason: "", loading: false, procStep: 0, adminOpen: false, adminSearch: "" }; render(); }
    function retryUid() { appState.failReason = ""; go("uid"); }
    function shake(id) { const el = document.getElementById(id); if (el) { el.style.animation = "shake 0.4s ease-in-out"; setTimeout(() => el.style.animation = "", 400); } }

    async function openAdmin() {
        if (!adminToken) {
            const pwd = prompt("🔐 Admin password:");
            if (!pwd) return;
            const ok = await adminLogin(pwd);
            if (!ok) { alert("Wrong password"); return; }
        }
        appState.adminOpen = true;
        render();
    }
    function closeAdmin() { appState.adminOpen = false; render(); }
    async function addUID() {
        const inp = document.getElementById("new-uid-input");
        const uid = inp.value.trim();
        if (!uid || !/^\d+$/.test(uid)) { alert("Invalid UID (digits only)"); return; }
        await addAdminUID(uid);
        inp.value = "";
        render();
    }
    async function toggleUID(uid) { await toggleAdminUID(uid); render(); }
    async function deleteUID(uid) { if (confirm("Delete this UID?")) { await deleteAdminUID(uid); render(); } }

    // ==================== RENDER ====================
    function renderSplash() {
        const firstLetter = user.first_name[0]?.toUpperCase() || "D";
        return `<div id="splash">
            <div class="splash-brand fade-up"><div class="badge">⚡ PREMIUM BOT</div><h1>JaiClub<br>Sureshot</h1><p>India's No.1 Colour Prediction</p></div>
            <div class="orbital-wrap fade-up">
                <div class="orbit-ring orbit-ring-1"></div><div class="orbit-ring orbit-ring-2"></div>
                <div class="avatar-core"><div class="avatar-glow"></div><div class="avatar-inner">${firstLetter}<div class="avatar-verified"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg></div></div></div>
            </div>
            <div class="splash-user fade-up"><div class="name">${user.first_name} ${user.last_name}</div><div class="handle">@${user.username}</div></div>
            <div class="fade-up" style="display:flex;gap:8px;background:rgba(255,255,255,0.05);border-radius:99px;padding:8px 20px;font-size:13px;"><span class="live-dot"></span>Launching your hack 🚀</div>
            <div class="splash-progress fade-up"><div class="progress-track"><div class="progress-fill" id="pfill"></div></div><div style="text-align:center;margin-top:8px;font-size:11px;">INITIALIZING <span id="pct">0%</span></div></div>
        </div>`;
    }

    function startSplash() {
        let p = 0;
        const iv = setInterval(() => {
            p += Math.random() * 18 + 6;
            if (p >= 100) { clearInterval(iv); setTimeout(() => go("home"), 300); }
            const fill = document.getElementById("pfill");
            const pct = document.getElementById("pct");
            if (fill) fill.style.width = Math.min(p,100) + "%";
            if (pct) pct.innerText = Math.min(Math.round(p),100) + "%";
        }, 160);
    }

    function renderHome() {
        return `<div class="screen"><div class="topbar"><div class="topbar-logo" id="logo-trigger"><div class="logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--g)" stroke-width="1.8"><path d="M12 2L4 6v6c0 5 3.5 9.5 8 10 4.5-.5 8-5 8-10V6l-8-4z"/><path d="M9 12l2 2 4-4"/></svg></div><div class="logo-text"><div class="t1">JaiClub</div><div class="t2">Sureshot · Premium</div></div></div><div class="live-badge"><span class="live-dot"></span>Live</div></div>
        <div class="hero"><div class="hero-sub">Welcome back</div><div class="hero-name">Hey ${user.first_name} <span>👋</span></div></div>
        <div class="info-card"><div class="info-scanline"></div><div class="info-title">🏆 JaiClubGame Prediction Bot</div><div class="info-desc">94% accuracy · Official UID required</div><div class="info-warn">⚠️ Only UIDs from official registration work</div></div>
        <div class="stats-row"><div class="stat-card"><div class="stat-val">94%</div><div class="stat-lbl">Accuracy</div></div><div class="stat-card"><div class="stat-val">12.4K</div><div class="stat-lbl">Members</div></div><div class="stat-card"><div class="stat-val">38✓</div><div class="stat-lbl">Today</div></div></div>
        <div class="options">${optCard("green","number","🎯","Get Number Sureshot","Single-digit hit rate")}${optCard("gold","bigsmall","📊","Get Big / Small Sureshot","Best big-small forecast")}${optCard("gray","support","💬","Contact Support","Talk to admin")}</div>
        <div class="footer-tip">⚡ Pro tip — Only official link registered UIDs are accepted</div></div>`;
    }

    function optCard(color, id, emoji, title, sub) {
        const onclick = id === "support" ? "window.open('https://t.me/Shetty_Bhaiii','_blank')" : `chooseOption('${id}')`;
        return `<button class="opt-btn ${color}" onclick="${onclick}"><div class="opt-inner"><div class="opt-icon">${emoji}</div><div class="opt-text"><div class="opt-title">${title}</div><div class="opt-sub">${sub}</div></div><div class="opt-arrow"><svg width="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg></div></div></button>`;
    }

    function renderUid() {
        const name = appState.option === "number" ? "Number Sureshot" : "Big / Small Sureshot";
        return `<div class="screen"><div class="screen-header">${backBtn("resetHome()")}<div class="screen-chip gold"><span class="chip-dot"></span>${name}</div><div style="width:40px;"></div></div>
        <div class="uid-info-card"><div class="uid-info-header"><div class="uid-info-icon"><svg width="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 14h4"/></svg></div><div><div class="greet">Hey <span>${user.first_name}</span> 🧑‍💻 Welcome</div><div class="uid-steps"><div class="uid-step"><span class="uid-step-num">1</span>Official link registration</div><div class="uid-step"><span class="uid-step-num">2</span>Register below</div><div class="uid-step"><span class="uid-step-num">3</span>Enter your UID</div></div></div></div><button class="reg-btn" onclick="window.open('https://www.jaiclub40.com/#/register?invitationCode=27868186702','_blank')"><svg width="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> Register on Official Site</button><div class="warn-strip">⚠️ Using an unofficial link → verification fails</div></div>
        <div class="input-section"><div class="input-label">Enter your UID</div><div class="input-group"><input type="text" id="uid-text-input" class="uid-text-input" placeholder="Type or paste UID" value="${appState.uid}" oninput="setUid(this.value.replace(/\\D/g,''))"><button class="paste-btn" onclick="pasteFromClipboard()">📋 Paste</button></div><div class="input-display ${appState.uid ? 'has-value' : ''}" id="uid-display"><div class="input-val ${appState.uid ? '' : 'empty'}">${appState.uid || '············'}</div><div class="input-count">${appState.uid.length}</div></div></div>
        <div class="keypad">${"123456789".split("").map(d => `<button class="key" onclick="typeUid('${d}')">${d}</button>`).join("")}<button class="key key-del" onclick="delUid()"><svg width="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 5H8L2 12l6 7h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button><button class="key" onclick="typeUid('0')">0</button><button class="key key-action" onclick="submitUid()"><svg width="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></button></div>
        <div class="keypad-note">🔒 Secure keypad + paste allowed</div></div>`;
    }

    function renderProcessing() {
        const steps = ["Connecting to server...", "Checking UID & device", "Validating source..."];
        return `<div id="processing"><div class="proc-ring-wrap"><div class="proc-ring"></div><div class="proc-ring-2"></div><div class="proc-dot"></div></div>
        <div class="proc-title">Verifying UID</div><div class="proc-sub">Please wait</div><div class="proc-steps">${steps.map((t,i)=>`<div class="proc-step ${i < appState.procStep ? 'done' : i === appState.procStep ? 'active' : ''}"><div class="step-icon">${i < appState.procStep ? '✓' : i+1}</div><div class="step-txt">${t}</div></div>`).join("")}</div></div>`;
    }

    function renderResult() {
        const lock = appState.failReason === "device_mismatch";
        return `<div class="screen"><div class="screen-header">${backBtn("resetHome()")}<div class="screen-chip red"><span class="chip-dot"></span>${lock ? "Device Locked" : "Failed"}</div><div style="width:40px;"></div></div>
        <div class="result-card glass-card" style="padding:30px 20px;"><div class="result-icon" style="width:80px;height:80px;margin:0 auto;border-radius:50%;background:rgba(239,68,68,0.15);display:flex;align-items:center;justify-content:center;">${lock ? '🔒' : '⚠️'}</div><div class="result-status">STATUS</div><div class="result-title" style="font-size:26px;">${lock ? "UID Locked to Another Device" : "Verification Failed"}</div><div class="result-uid" style="font-family:monospace;margin-top:8px;">UID: <span style="color:white;">${appState.uid}</span></div></div>
        <div class="reason-cards">${lock ? `<div class="glass-card" style="padding:16px;margin-bottom:10px;"><div style="display:flex;gap:12px;"><span style="font-size:28px;">🔒</span><div>This UID is already bound to another device.<br><strong>One UID = one device</strong></div></div></div><div class="glass-card" style="padding:16px;"><div style="display:flex;gap:12px;"><span style="font-size:28px;">💬</span><div>Contact admin to unbind: <strong>@Shetty_Bhaiii</strong></div></div></div>` : `<div class="glass-card" style="padding:16px;margin-bottom:10px;"><div style="display:flex;gap:12px;"><span style="font-size:28px;">🚨</span><div><strong>Bot activation required</strong> — recharge ₹200 and try again.</div></div></div><div class="glass-card" style="padding:16px;"><div style="display:flex;gap:12px;"><span style="font-size:28px;">⚠️</span><div>Only UIDs from official registration are accepted.</div></div></div>`}</div>
        <div class="action-buttons"><button class="btn btn-primary" onclick="${lock ? "window.open('https://t.me/Shetty_Bhaiii','_blank')" : "window.open('https://www.jaiclub40.com/#/register?invitationCode=27868186702','_blank')"}">${lock ? "Contact Admin" : "Register Official Link"}</button></div>
        <div class="action-buttons"><button class="btn btn-secondary" onclick="retryUid()">Re-enter UID</button><button class="btn btn-secondary" onclick="resetHome()">Home</button></div>
        </div>`;
    }

    function renderPrediction() {
        const isNum = appState.option === "number";
        return `<div class="screen"><div class="screen-header">${backBtn("resetHome()")}<div class="screen-chip green"><span class="chip-dot"></span>Verified</div><div style="width:40px;"></div></div>
        <div class="pred-header-card"><div class="pred-header-inner"><div class="pred-verified-icon"><svg width="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg></div><div><div class="pred-greet">Welcome <span>${user.first_name}</span> ✓</div><div class="pred-uid">UID <span>${appState.verifiedUid}</span> verified</div></div></div><div class="pred-mode-sub"><div class="pred-mode-title">${isNum ? "Number Sureshot" : "Big / Small Sureshot"}</div><div class="pred-mode-desc">Enter period number</div></div></div>
        <div class="toggle-row"><button class="toggle-btn ${isNum ? 'active green' : ''}" onclick="switchOpt('number')">🎯 Number</button><button class="toggle-btn ${!isNum ? 'active gold' : ''}" onclick="switchOpt('bigsmall')">📊 Big/Small</button></div>
        <div class="input-section"><div class="input-label">Period Number</div><div id="period-display" class="input-display"><div class="input-val ${appState.period ? '' : 'empty'}">${appState.period || 'e.g. 247'}</div><div class="input-count">${appState.period.length}/3</div></div></div>
        <div style="margin:16px 0;">${appState.loading ? `<div class="glass-card" style="padding:24px;text-align:center;"><div>Generating prediction...</div><div class="pred-loading-ring"></div></div>` : (appState.prediction ? `<div class="pred-result"><div class="pred-result-label">Sureshot · Period ${appState.prediction.period}</div>${isNum ? `<div class="pred-number">${appState.prediction.value}</div>` : `<div class="pred-bigsmall ${appState.prediction.value === 'BIG' ? 'big' : 'small'}">${appState.prediction.value}</div>`}<div class="pred-confirm">✓ Locked prediction · play with confidence</div></div>` : "")}</div>
        <div class="keypad">${"123456789".split("").map(d => `<button class="key" onclick="typePeriod('${d}')">${d}</button>`).join("")}<button class="key key-del" onclick="delPeriod()"><svg width="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 5H8L2 12l6 7h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button><button class="key" onclick="typePeriod('0')">0</button><button class="key key-action" onclick="submitPeriod()">${appState.loading ? '<div style="width:24px;height:24px;border:2px solid white;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite;"></div>' : '<svg width="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>'}</button></div>
        <div class="keypad-note">Tap again to re-roll</div></div>`;
    }

    function backBtn(onclick) {
        return `<button class="back-btn" onclick="${onclick}"><svg width="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"/></svg></button>`;
    }

    async function renderAdminPanel() {
        if (!appState.adminOpen) return "";
        let filtered = mockUIDs.filter(e => e.uid.includes(appState.adminSearch));
        return `<div class="admin-overlay" onclick="if(event.target===this) closeAdmin()"><div class="admin-panel"><div class="admin-header"><h3>⚙️ Admin Panel</h3><button class="admin-close" onclick="closeAdmin()">✕</button></div><div class="admin-search"><input type="text" placeholder="🔍 Search UID" id="admin-search" value="${appState.adminSearch}" oninput="appState.adminSearch=this.value; render()"></div><div class="admin-list">${filtered.map(e => `<div class="admin-item"><div><div>${e.uid}</div><small>${e.deviceId ? '🔗 bound' : '📱 free'} · ${e.active ? '✅ Active' : '❌ Inactive'}</small></div><div class="admin-item-actions"><button class="admin-toggle" style="color:var(--gold);" onclick="toggleUID('${e.uid}')">${e.active ? 'Deactivate' : 'Activate'}</button><button class="admin-delete" style="color:#ff6b6b;" onclick="deleteUID('${e.uid}')">Delete</button></div></div>`).join('')}<div class="admin-item" style="background:rgba(0,255,136,0.1);"><div><strong>${MASTER_UID}</strong><small style="display:block;">🔓 Always allowed</small></div><div><span class="admin-badge">MASTER</span></div></div></div><div class="admin-add"><input id="new-uid-input" placeholder="12-digit UID"><button onclick="addUID()">Add</button></div></div></div>`;
    }

    async function render() {
        const app = document.getElementById("app");
        if (!app) return;
        if (appState.screen === "splash") {
            app.innerHTML = renderSplash();
            startSplash();
            return;
        }
        let mainHtml = "";
        switch (appState.screen) {
            case "home": mainHtml = renderHome(); break;
            case "uid": mainHtml = renderUid(); break;
            case "processing": mainHtml = renderProcessing(); break;
            case "result": mainHtml = renderResult(); break;
            case "prediction": mainHtml = renderPrediction(); break;
            default: mainHtml = renderHome();
        }
        const adminHtml = await renderAdminPanel();
        app.innerHTML = mainHtml + adminHtml;
        if (appState.screen === "home") {
            const logo = document.getElementById("logo-trigger");
            if (logo && !logo._tapHandler) {
                let tap = 0, t = null;
                const handler = () => { tap++; if (t) clearTimeout(t); t = setTimeout(() => tap = 0, 800); if (tap >= 5) { tap = 0; openAdmin(); } };
                logo.addEventListener("click", handler);
                logo._tapHandler = handler;
            }
        }
        if (appState.screen === "uid") {
            const inputEl = document.getElementById("uid-text-input");
            if (inputEl) inputEl.focus();
        }
    }

    window.chooseOption = chooseOption;
    window.setUid = setUid;
    window.typeUid = typeUid;
    window.delUid = delUid;
    window.submitUid = submitUid;
    window.resetHome = resetHome;
    window.retryUid = retryUid;
    window.typePeriod = typePeriod;
    window.delPeriod = delPeriod;
    window.submitPeriod = submitPeriod;
    window.switchOpt = switchOpt;
    window.pasteFromClipboard = pasteFromClipboard;
    window.openAdmin = openAdmin;
    window.closeAdmin = closeAdmin;
    window.addUID = addUID;
    window.toggleUID = toggleUID;
    window.deleteUID = deleteUID;

    render();
</script>
</body>
</html>
