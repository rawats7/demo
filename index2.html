        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        @keyframes number-pop { 0% { transform: scale(0.5) rotate(-10deg); opacity: 0; } 60% { transform: scale(1.15) rotate(2deg); } 100% { transform: scale(1) rotate(0); opacity: 1; } }

        .result-title { font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 800; margin-top: 6px; color: white; }
        .result-uid { font-family: monospace; font-size: 13px; color: var(--muted); margin-top: 6px; }
        .result-uid span { color: var(--text); }
        .reason-cards { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .reason-card { display: flex; align-items: flex-start; gap: 14px; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
        .reason-emoji { font-size: 22px; flex-shrink: 0; margin-top: 2px; }
        .reason-text { font-size: 13px; color: #9ca3af; line-height: 1.6; }
        .reason-text strong { color: var(--text); }
        .action-stack { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
        .act-btn { width: 100%; height: 54px; border: none; cursor: pointer; border-radius: 14px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s, opacity 0.1s; }
        .act-btn:active { transform: scale(0.97); opacity: 0.9; }
        .act-btn.primary { background: linear-gradient(135deg, var(--g2), #00a854); color: white; box-shadow: 0 8px 24px rgba(0,204,106,0.25); }
        .act-btn.secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
        .act-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        /* Prediction */
        .pred-header-card { margin-top: 20px; border-radius: 18px; background: var(--surface); border: 1px solid rgba(0,255,136,0.15); padding: 18px 20px; position: relative; overflow: hidden; }
        .pred-header-inner { display: flex; align-items: center; gap: 12px; }
        .pred-verified-icon { width: 44px; height: 44px; border-radius: 13px; background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.2); display: flex; align-items: center; justify-content: center; color: var(--g); }
        .pred-greet { font-weight: 600; font-size: 15px; color: white; }
        .pred-greet span { color: var(--g); }
        .pred-uid { font-family: monospace; font-size: 11px; color: var(--muted); margin-top: 3px; }
        .pred-uid span { color: var(--text); }
        .pred-mode-sub { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
        .pred-mode-title { font-weight: 600; font-size: 14px; color: white; }
        .pred-mode-desc { font-size: 12px; color: var(--muted); margin-top: 3px; }
        .toggle-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 18px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 14px; padding: 4px; }
        .toggle-btn { height: 44px; border: none; cursor: pointer; border-radius: 11px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; background: none; color: var(--muted); transition: all 0.2s; }
        .toggle-btn.active.green { background: rgba(0,255,136,0.12); color: var(--g); border: 1px solid rgba(0,255,136,0.2); }
        .toggle-btn.active.gold { background: rgba(251,191,36,0.12); color: var(--gold); border: 1px solid rgba(251,191,36,0.2); }
        .pred-result { border-radius: 28px; padding: 32px 20px; text-align: center; background: rgba(0,255,136,0.02); backdrop-filter: blur(12px); border: 1px solid rgba(0,255,136,0.2); position: relative; overflow: hidden; animation: fadeUp 0.5s cubic-bezier(0.2,0.9,0.4,1.1) both; }
        .pred-result-label { font-family: monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--g); background: rgba(0,255,136,0.1); display: inline-block; padding: 4px 12px; border-radius: 40px; margin-bottom: 16px; }
        .pred-number { font-family: 'Inter', sans-serif; font-size: 96px; font-weight: 800; line-height: 1; background: linear-gradient(135deg, #fff, var(--g)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(0,255,136,0.3); animation: number-pop 0.5s cubic-bezier(0.22,1,0.36,1) both; display: inline-block; }
        .pred-bigsmall { font-family: 'Inter', sans-serif; font-size: 58px; font-weight: 800; line-height: 1; animation: number-pop 0.5s cubic-bezier(0.22,1,0.36,1) both; display: inline-block; padding: 0 20px; border-radius: 60px; }
        .pred-bigsmall.big { background: linear-gradient(135deg, #fff, var(--g)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 20px rgba(0,255,136,0.4); }
        .pred-bigsmall.small { background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 20px rgba(251,191,36,0.4); }
        .pred-confirm { margin-top: 20px; font-size: 13px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .pred-confirm::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--g); }
        .pred-loading { border-radius: 28px; padding: 32px 20px; text-align: center; background: rgba(0,0,0,0.4); border: 1px solid var(--border); }
        .pred-loading-label { font-size: 14px; color: var(--muted); }
        .pred-loading-ring { width: 42px; height: 42px; margin: 18px auto 0; border-radius: 50%; border: 2px solid rgba(0,255,136,0.2); border-top-color: var(--g); animation: spin 0.8s linear infinite; }
        /* Admin panel */
        .admin-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .admin-panel { width: 100%; max-width: 400px; max-height: 85vh; background: #0f1419; border-radius: 28px; border: 1px solid rgba(0,255,136,0.3); overflow: hidden; display: flex; flex-direction: column; animation: fadeUp 0.3s ease; }
        .admin-header { padding: 18px 20px; background: rgba(0,255,136,0.08); border-bottom: 1px solid rgba(0,255,136,0.2); display: flex; justify-content: space-between; align-items: center; }
        .admin-header h3 { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; color: var(--g); }
        .admin-close { background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
        .admin-content { flex: 1; overflow-y: auto; padding: 20px; }
        .admin-add { display: flex; gap: 10px; margin-bottom: 20px; }
        .admin-add input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: var(--text); font-family: monospace; }
        .admin-add button { background: var(--g); border: none; border-radius: 12px; padding: 0 18px; font-weight: bold; color: black; cursor: pointer; }
        .admin-list { display: flex; flex-direction: column; gap: 10px; }
        .admin-item { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .admin-item-info { font-family: monospace; font-size: 13px; }
        .admin-item-info small { color: var(--muted); font-size: 10px; display: block; }
        .admin-item-actions button { background: none; border: none; cursor: pointer; margin-left: 8px; font-size: 16px; }
        .admin-toggle { color: var(--gold); }
        .admin-delete { color: #f87171; }
        .admin-badge { display: inline-block; font-size: 10px; background: rgba(0,255,136,0.2); color: var(--g); border-radius: 99px; padding: 2px 8px; margin-left: 8px; }
    </style>
</head>
<body>
<div id="app"></div>
<script>
    // ==================== TELEGRAM REAL USER DATA (works inside Telegram) ====================
    const tg = window.Telegram?.WebApp;
    const initUser = tg?.initDataUnsafe?.user || { first_name: "Demo", last_name: "User", username: "demo_user", photo_url: null };
    const user = {
        id: initUser.id?.toString() || "demo",
        first_name: initUser.first_name || "Demo",
        last_name: initUser.last_name || "",
        username: initUser.username || "demo_user",
        photo_url: initUser.photo_url || null
    };
    if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor("#030608"); tg.setBackgroundColor("#030608"); }

    // ==================== MOCK BACKEND (localStorage for demo) ====================
    let mockUIDs = JSON.parse(localStorage.getItem("mock_uids") || '[{"uid":"123456789012","active":true,"deviceId":null},{"uid":"987654321098","active":false,"deviceId":null}]');
    function saveMockUIDs() { localStorage.setItem("mock_uids", JSON.stringify(mockUIDs)); }

    let adminToken = localStorage.getItem("admin_token");
    const MASTER_UID = "928616";

    async function mockVerify(uid, deviceId) {
        await new Promise(r => setTimeout(r, 1800));
        if (uid === MASTER_UID) return { ok: true };
        const entry = mockUIDs.find(e => e.uid === uid);
        if (!entry) return { ok: false, reason: "not_verified" };
        if (!entry.active) return { ok: false, reason: "not_verified" };
        if (entry.deviceId && entry.deviceId !== deviceId) return { ok: false, reason: "device_mismatch" };
        if (!entry.deviceId) { entry.deviceId = deviceId; saveMockUIDs(); }
        return { ok: true };
    }
    async function mockPredict(period, type) {
        await new Promise(r => setTimeout(r, 900));
        const seed = (parseInt(period) || 1) * 3 + 7;
        if (type === "number") return { value: String(seed % 10) };
        return { value: seed % 2 === 0 ? "BIG" : "SMALL" };
    }

    // ==================== STATE ====================
    let appState = {
        screen: "splash",
        option: null,
        uid: "",
        verifiedUid: null,
        failReason: "",
        period: "",
        prediction: null,
        loading: false,
        procStep: 0,
        adminOpen: false
    };

    function haptic(style) { if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(style); }
    function getDeviceId() { let id = localStorage.getItem("device_id"); if (!id) { id = "dev_" + Math.random().toString(36).slice(2) + Date.now(); localStorage.setItem("device_id", id); } return id; }
    const deviceId = getDeviceId();

    // Mock API calls
    async function apiVerify(uid) { return await mockVerify(uid, deviceId); }
    async function apiPredict(period, type) { return await mockPredict(period, type); }
    async function adminLogin(password) {
        if (password === "admin123") { localStorage.setItem("admin_token", "mock_token"); adminToken = "mock_token"; return true; }
        return false;
    }
    async function adminFetch(endpoint, options) {
        if (!adminToken) return null;
        if (endpoint === "/api/admin/uids" && !options?.method) return mockUIDs;
        if (options?.method === "POST") {
            const { uid } = JSON.parse(options.body);
            if (!mockUIDs.some(e => e.uid === uid)) {
                mockUIDs.push({ uid, active: true, deviceId: null });
                saveMockUIDs();
            }
        }
        if (options?.method === "PUT") {
            const uid = endpoint.split("/")[3];
            const entry = mockUIDs.find(e => e.uid === uid);
            if (entry) entry.active = !entry.active;
            saveMockUIDs();
        }
        if (options?.method === "DELETE") {
            const uid = endpoint.split("/")[3];
            mockUIDs = mockUIDs.filter(e => e.uid !== uid);
            saveMockUIDs();
        }
        return { message: "ok" };
    }

    // ==================== STATE ACTIONS ====================
    function go(screen) { appState.screen = screen; render(); }
    function chooseOption(opt) { appState.option = opt; appState.prediction = null; appState.period = ""; go(appState.verifiedUid ? "prediction" : "uid"); }
    function typeUid(d) { appState.uid += d; render(); }
    function delUid() { appState.uid = appState.uid.slice(0, -1); render(); }
    async function submitUid() {
        if (!appState.uid) { shake("uid-display"); haptic("error"); return; }
        appState.procStep = 0; go("processing");
        setTimeout(() => { appState.procStep = 1; render(); }, 700);
        setTimeout(() => { appState.procStep = 2; render(); }, 1400);
        const res = await apiVerify(appState.uid);
        if (res.ok) { appState.verifiedUid = appState.uid; go("prediction"); }
        else { appState.failReason = res.reason; go("result"); }
    }
    function typePeriod(d) { if (appState.period.length < 3) { appState.period += d; render(); } }
    function delPeriod() { appState.period = appState.period.slice(0, -1); render(); }
    async function submitPeriod() {
        if (appState.period.length < 3) { shake("period-display"); haptic("error"); return; }
        appState.loading = true; render();
        const pred = await apiPredict(appState.period, appState.option);
        if (pred) appState.prediction = pred;
        appState.loading = false; render();
    }
    function switchOpt(opt) { appState.option = opt; appState.prediction = null; appState.period = ""; render(); }
    function resetHome() { appState = { ...appState, screen: "home", option: null, uid: "", period: "", prediction: null, failReason: "", loading: false, procStep: 0, adminOpen: false }; render(); }
    function retryUid() { appState.failReason = ""; go("uid"); }
    function shake(id) { const el = document.getElementById(id); if (el) { el.style.animation = "shake 0.4s ease-in-out"; setTimeout(() => el.style.animation = "", 400); } }

    async function openAdmin() {
        if (!adminToken) { const pwd = prompt("🔐 Admin password:"); if (!pwd) return; const ok = await adminLogin(pwd); if (!ok) { alert("Wrong password"); return; } }
        appState.adminOpen = true; render();
    }
    function closeAdmin() { appState.adminOpen = false; render(); }
    async function addAdminUID() {
        const inp = document.getElementById("new-uid-input");
        const uid = inp.value.trim();
        if (!uid || !/^\d+$/.test(uid)) { alert("Invalid UID"); return; }
        if (mockUIDs.some(e => e.uid === uid)) { alert("UID already exists"); return; }
        await adminFetch("/api/admin/uids", { method: "POST", body: JSON.stringify({ uid }) });
        inp.value = ""; render();
    }
    async function toggleAdminUID(uid) {
        await adminFetch(`/api/admin/uids/${uid}/toggle`, { method: "PUT" });
        render();
    }
    async function deleteAdminUID(uid) {
        if (confirm("Delete UID?")) {
            await adminFetch(`/api/admin/uids/${uid}`, { method: "DELETE" });
            render();
        }
    }

    // ==================== RENDER FUNCTIONS ====================
    function renderSplash() {
        const firstLetter = (user.first_name[0] || "D").toUpperCase();
        return `<div id="splash">
            <div class="splash-brand fade-up"><div class="badge">⚡ Premium Bot</div><h1>JaiClub<br>Sureshot</h1><p>India's No.1 Colour Prediction</p></div>
            <div class="orbital-wrap fade-up fade-up-d1"><div class="orbit-ring orbit-ring-1"></div><div class="orbit-ring orbit-ring-2"></div><div class="avatar-core"><div class="avatar-glow"></div><div class="avatar-inner">${firstLetter}<div class="avatar-verified"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg></div></div></div></div>
            <div class="splash-user fade-up fade-up-d2"><div class="name">${user.first_name} ${user.last_name}</div><div class="handle">@${user.username}</div></div>
            <div class="fade-up fade-up-d3" style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:99px;padding:8px 20px;font-size:13px;font-weight:600;"><span style="position:relative;display:inline-flex;"><span style="width:8px;height:8px;border-radius:50%;background:var(--g);"></span><span style="position:absolute;inset:0;border-radius:50%;background:var(--g);animation:ping 1.5s infinite;"></span></span>Launching your hack 🚀</div>
            <div class="splash-progress fade-up fade-up-d4"><div class="progress-track"><div class="progress-fill" id="pfill"></div></div><div style="text-align:center;margin-top:8px;font-size:11px;">INITIALIZING <span id="pct">0%</span></div></div>
        </div>`;
    }

    function startSplash() {
        let p = 0;
        const iv = setInterval(() => {
            p += Math.random() * 18 + 6;
            if (p >= 100) { clearInterval(iv); setTimeout(() => go("home"), 300); }
            const fill = document.getElementById("pfill");
            const pct = document.getElementById("pct");
            if (fill) fill.style.width = Math.min(p,100) + "%";
            if (pct) pct.innerText = Math.min(Math.round(p),100) + "%";
        }, 160);
    }

    function renderHome() {
        return `<div class="screen"><div class="topbar"><div class="topbar-logo" id="logo-trigger"><div class="logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--g)" stroke-width="1.8"><path d="M12 2L4 6v6c0 5 3.5 9.5 8 10 4.5-.5 8-5 8-10V6l-8-4z"/><path d="M9 12l2 2 4-4"/></svg></div><div class="logo-text"><div class="t1">JaiClub</div><div class="t2">Sureshot · Premium</div></div></div><div class="live-badge"><span class="live-dot"></span>Live</div></div>
        <div class="hero"><div class="hero-sub">Welcome back</div><div class="hero-name">Hey ${user.first_name} <span>👋</span></div></div>
        <div class="info-card"><div class="info-scanline"></div><div class="info-title">🏆 JaiClubGame Prediction Bot</div><div class="info-desc">Get India's No.1 colour prediction with <strong style="color:var(--g);">94% accuracy</strong>. Verified UIDs from official link only.</div><div class="info-warn">⚠️ If you have an active UID, use the same. New users must register via official link below.</div></div>
        <div class="stats-row"><div class="stat-card"><div class="stat-val">94%</div><div class="stat-lbl">Accuracy</div></div><div class="stat-card"><div class="stat-val">12.4K</div><div class="stat-lbl">Members</div></div><div class="stat-card"><div class="stat-val">38✓</div><div class="stat-lbl">Today</div></div></div>
        <div class="options">${optCard("green","number","🎯","Get Number Sureshot","Single-digit hit rate prediction")}${optCard("gold","bigsmall","📊","Get Big / Small Sureshot","Best big-small forecast for next round")}${optCard("gray","support","💬","Contact Support","Talk to admin · @Shetty_Bhaiii")}</div>
        <div class="footer-tip">⚡ Pro tip — Only official link registered UIDs are accepted</div></div>`;
    }

    function optCard(color, id, emoji, title, sub) {
        const onclick = id === "support" ? "window.open('https://t.me/Shetty_Bhaiii','_blank')" : `chooseOption('${id}')`;
        return `<button class="opt-btn ${color}" onclick="${onclick}"><div class="opt-inner"><div class="opt-icon">${emoji}</div><div class="opt-text"><div class="opt-title">${title}</div><div class="opt-sub">${sub}</div></div><div class="opt-arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></div></div></button>`;
    }

    function renderUid() {
        const name = appState.option === "number" ? "Number Sureshot" : "Big / Small Sureshot";
        return `<div class="screen"><div class="screen-header">${backBtn("resetHome()")}<div class="screen-chip gold"><span class="chip-dot"></span>${name}</div><div style="width:40px;"></div></div>
        <div class="uid-info-card"><div class="uid-info-header"><div class="uid-info-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 14h4"/></svg></div><div class="uid-info-content"><div class="greet">Hey <span>${user.first_name}</span> 🧑‍💻 Welcome</div><div class="uid-steps"><div class="uid-step"><div class="uid-step-num">1</div>Official link registration mandatory</div><div class="uid-step"><div class="uid-step-num">2</div>Register via button below</div><div class="uid-step"><div class="uid-step-num">3</div>Enter your UID after registering</div></div></div></div><button class="reg-btn" onclick="window.open('https://www.jaiclub40.com/#/register?invitationCode=27868186702','_blank')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> Register on Official Site</button><div class="warn-strip">⚠️ Using an unofficial link? Your verification will fail.</div></div>
        <div class="input-section"><div class="input-label">Enter your UID</div><div class="input-display ${appState.uid ? 'has-value' : ''}" id="uid-display"><div class="input-val ${appState.uid ? '' : 'empty'}">${appState.uid || '· · · · · ·'}</div><div class="input-count">${appState.uid.length}</div></div></div>
        <div class="keypad">${"123456789".split("").map(d => `<button class="key" onclick="typeUid('${d}')">${d}</button>`).join("")}<button class="key key-del" onclick="delUid()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 5H8L2 12l6 7h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button><button class="key" onclick="typeUid('0')">0</button><button class="key key-action" onclick="submitUid()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></button></div>
        <div class="keypad-note">🔒 Secure in-app keypad only</div></div>`;
    }

    function renderProcessing() {
        const steps = ["Connecting to verification server", "Checking UID against database", "Validating registration source"];
        return `<div id="processing"><div class="proc-ring-wrap"><div class="proc-ring"></div><div class="proc-ring-2"></div><div class="proc-dot"></div></div>
        <div class="proc-title">Verifying UID</div><div class="proc-sub">Please wait, do not close the app</div><div class="proc-steps">${steps.map((t,i)=>`<div class="proc-step ${i < appState.procStep ? 'done' : i === appState.procStep ? 'active' : ''}"><div class="step-icon">${i < appState.procStep ? '✓' : i+1}</div><div class="step-txt">${t}</div></div>`).join("")}</div></div>`;
    }

    function renderResult() {
        const lock = appState.failReason === "device_mismatch";
        return `<div class="screen"><div class="screen-header">${backBtn("resetHome()")}<div class="screen-chip red"><span class="chip-dot"></span>${lock ? "Device Locked" : "Failed"}</div><div style="width:40px;"></div></div>
        <div class="result-card"><div class="result-icon">${lock ? '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' : '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'}</div>
        <div class="result-status">Status</div><div class="result-title">${lock ? "UID Locked to Another Device" : "Verification Failed"}</div><div class="result-uid">UID: <span>${appState.uid}</span></div></div>
        <div class="reason-cards">${lock ? `<div class="reason-card"><div class="reason-emoji">🔒</div><div class="reason-text">This UID is already bound to another device. One UID can only be used on <strong>one device</strong>.</div></div><div class="reason-card"><div class="reason-emoji">💬</div><div class="reason-text">Need to switch devices? Contact admin to <strong>unbind your UID</strong>.</div></div>` : `<div class="reason-card"><div class="reason-emoji">🚨</div><div class="reason-text"><strong>Bot activation required</strong> — recharge <strong style="color:#f87171;">₹200</strong> and try again.</div></div><div class="reason-card"><div class="reason-emoji">⚠️</div><div class="reason-text">Verification works only if you registered via the <strong>official link</strong>.</div></div>`}</div>
        <div class="action-stack">${lock ? `<button class="act-btn primary" onclick="window.open('https://t.me/Shetty_Bhaiii','_blank')">💬 Contact Admin to Unbind</button>` : `<button class="act-btn primary" onclick="window.open('https://www.jaiclub40.com/#/register?invitationCode=27868186702','_blank')">🔗 Open Official Register Link</button>`}<div class="act-row"><button class="act-btn secondary" onclick="retryUid()">Re-enter UID</button><button class="act-btn secondary" onclick="resetHome()">Home</button></div></div></div>`;
    }

    function renderPrediction() {
        const isNum = appState.option === "number";
        return `<div class="screen"><div class="screen-header">${backBtn("resetHome()")}<div class="screen-chip green"><span class="chip-dot"></span>Verified</div><div style="width:40px;"></div></div>
        <div class="pred-header-card"><div class="pred-header-inner"><div class="pred-verified-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div><div><div class="pred-greet">Welcome <span>${user.first_name}</span> ✓</div><div class="pred-uid">UID <span>${appState.verifiedUid}</span> verified</div></div></div><div class="pred-mode-sub"><div class="pred-mode-title">${isNum ? "Number Sureshot" : "Big / Small Sureshot"}</div><div class="pred-mode-desc">Enter period number to get sureshot prediction</div></div></div>
        <div class="toggle-row"><button class="toggle-btn ${isNum ? 'active green' : ''}" onclick="switchOpt('number')">🎯 Number</button><button class="toggle-btn ${!isNum ? 'active gold' : ''}" onclick="switchOpt('bigsmall')">📊 Big / Small</button></div>
        <div class="input-section"><div class="input-label">Period Number</div><div class="input-display ${appState.period ? 'has-value' : ''}" id="period-display"><div class="input-val ${appState.period ? '' : 'empty'}">${appState.period || 'e.g. 247'}</div><div class="input-count">${appState.period.length}/3</div></div></div>
        <div style="margin-top:14px;">${appState.loading ? `<div class="pred-loading"><div class="pred-loading-label">Generating prediction…</div><div class="pred-loading-ring"></div></div>` : (appState.prediction ? `<div class="pred-result"><div class="pred-result-label">Sureshot · Period ${appState.prediction.period}</div>${isNum ? `<span class="pred-number">${appState.prediction.value}</span>` : `<span class="pred-bigsmall ${appState.prediction.value === 'BIG' ? 'big' : 'small'}">${appState.prediction.value}</span>`}<div class="pred-confirm">Locked prediction · play with confidence</div></div>` : "")}</div>
        <div class="keypad">${"123456789".split("").map(d => `<button class="key" onclick="typePeriod('${d}')">${d}</button>`).join("")}<button class="key key-del" onclick="delPeriod()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 5H8L2 12l6 7h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button><button class="key" onclick="typePeriod('0')">0</button><button class="key key-action" onclick="submitPeriod()">${appState.loading ? '<div style="width:24px;height:24px;border:2px solid white;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite;"></div>' : '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>'}</button></div>
        <div class="keypad-note">Tap again to re-roll · each tap gives a fresh prediction</div></div>`;
    }

    function backBtn(onclick) {
        return `<button class="back-btn" onclick="${onclick}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>`;
    }

    async function renderAdminPanel() {
        if (!appState.adminOpen) return "";
        return `<div class="admin-overlay" onclick="closeAdmin(event)"><div class="admin-panel" onclick="event.stopPropagation()"><div class="admin-header"><h3>⚙️ Admin Panel</h3><button class="admin-close" onclick="closeAdmin()">✕</button></div><div class="admin-content"><div class="admin-add"><input type="text" id="new-uid-input" placeholder="UID (digits only)"><button onclick="addAdminUID()">Add</button></div><div class="admin-list">${mockUIDs.map(e => `<div class="admin-item"><div class="admin-item-info">${e.uid}${e.deviceId ? '<small>🔗 bound to device</small>' : '<small>📱 not bound</small>'}<small>Active: ${e.active ? '✅' : '❌'}</small></div><div class="admin-item-actions"><button class="admin-toggle" onclick="toggleAdminUID('${e.uid}')">${e.active ? '🔴 Deactivate' : '🟢 Activate'}</button><button class="admin-delete" onclick="deleteAdminUID('${e.uid}')">🗑️ Delete</button></div></div>`).join('')}<div class="admin-item"><div class="admin-item-info"><strong>928616</strong><small>🔓 Master UID (always allowed)</small></div><div class="admin-item-actions"><span class="admin-badge">MASTER</span></div></div></div></div></div></div>`;
    }

    async function render() {
        const app = document.getElementById("app");
        if (!app) return;
        if (appState.screen === "splash") {
            app.innerHTML = renderSplash();
            startSplash();
            return;
        }
        let mainHtml = "";
        switch (appState.screen) {
            case "home": mainHtml = renderHome(); break;
            case "uid": mainHtml = renderUid(); break;
            case "processing": mainHtml = renderProcessing(); break;
            case "result": mainHtml = renderResult(); break;
            case "prediction": mainHtml = renderPrediction(); break;
            default: mainHtml = renderHome();
        }
        const adminHtml = await renderAdminPanel();
        app.innerHTML = mainHtml + adminHtml;
        if (appState.screen === "home") {
            const logo = document.getElementById("logo-trigger");
            if (logo && !logo._tapHandler) {
                let tap = 0, t = null;
                const handler = () => { tap++; if (t) clearTimeout(t); t = setTimeout(() => tap = 0, 800); if (tap >= 5) { tap = 0; openAdmin(); } };
                logo.addEventListener("click", handler);
                logo._tapHandler = handler;
            }
        }
    }

    // Expose globals
    window.chooseOption = chooseOption;
    window.typeUid = typeUid; window.delUid = delUid; window.submitUid = submitUid;
    window.resetHome = resetHome; window.retryUid = retryUid;
    window.typePeriod = typePeriod; window.delPeriod = delPeriod; window.submitPeriod = submitPeriod;
    window.switchOpt = switchOpt;
    window.openAdmin = openAdmin; window.closeAdmin = closeAdmin;
    window.addAdminUID = addAdminUID; window.toggleAdminUID = toggleAdminUID; window.deleteAdminUID = deleteAdminUID;

    render();
</script>
</body>
</html>
